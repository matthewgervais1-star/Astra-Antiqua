# The Android surface's CI. One job: compile the debug sources and run the JVM
# unit tests. The GitHub Ubuntu runner ships the Android SDK at ANDROID_HOME,
# so the job writes no local.properties.
# shared/** is a trigger because android/app/build.gradle.kts reads
# ../shared/content as an assets directory.
name: android

on:
  push:
    paths:
      - "android/**"
      - "shared/**"
      - "web/scripts/gen-android-*.mjs"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "shared/**"
      - "web/scripts/gen-android-*.mjs"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and unit test
        run: ./gradlew compileDebugSources testDebugUnitTest --console=plain --no-daemon
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: android/app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
