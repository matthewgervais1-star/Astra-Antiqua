# The Android surface's CI. One job: compile the debug sources and run the JVM
# unit tests. The GitHub Ubuntu runner ships the Android SDK at ANDROID_HOME,
# so the job writes no local.properties.
# shared/** is a trigger because android/app/build.gradle.kts reads
# ../shared/content as an assets directory. The web files and the dotnet
# goldens are triggers because the generator inputs and the parity tests read
# them: web/src/data/**, decree.ts (WeekShorthandParityTest), chartFormat.ts
# (ZodiacSignAbbrTest) and the goldens file (TransitMidheavenTest).
name: android

on:
  push:
    paths:
      - "android/**"
      - "shared/**"
      - "web/src/data/**"
      - "web/src/lib/decree.ts"
      - "web/src/components/charts/chartFormat.ts"
      - "web/scripts/gen-android-*.mjs"
      - "dotnet/AstraAntiqua.Core.Tests/TestData/goldens.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "shared/**"
      - "web/src/data/**"
      - "web/src/lib/decree.ts"
      - "web/src/components/charts/chartFormat.ts"
      - "web/scripts/gen-android-*.mjs"
      - "dotnet/AstraAntiqua.Core.Tests/TestData/goldens.json"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and unit test
        run: ./gradlew compileDebugSources testDebugUnitTest --console=plain --no-daemon
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: android/app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
