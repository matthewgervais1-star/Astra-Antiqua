# The .NET surface's CI. Two jobs:
#   core-tests — the parity + completeness suite, on Linux (mirrors what the
#                Windows workstation runs locally with `dotnet test`).
#   ios-build  — the MAUI head, on macOS, because compiling iOS requires
#                Apple's build tools. Unsigned simulator build for now;
#                signing + TestFlight need an Apple Developer membership
#                and come later.
name: dotnet

on:
  push:
    paths:
      - "dotnet/**"
      - "shared/**"
      - "android/app/src/main/res/font/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test AstraAntiqua.Core
        run: dotnet test dotnet/AstraAntiqua.Core.Tests --configuration Release
      - name: Compile-check the iOS head's pages (net8.0, no workload)
        run: dotnet build dotnet/AstraAntiqua.App.Check --configuration Release

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # The MAUI workload pins the Xcode its iOS SDK needs (10.0.402.1 needs
      # Xcode 27.1). The runner's default Xcode can lag that, so select the
      # newest one installed and print the list for when it is not enough.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Build iOS head (unsigned, simulator)
        run: >
          dotnet build dotnet/AstraAntiqua.App/AstraAntiqua.App.csproj
          -f net10.0-ios
          -c Release
          -p:RuntimeIdentifier=iossimulator-arm64
