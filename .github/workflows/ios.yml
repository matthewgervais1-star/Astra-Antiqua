# The .NET surface's CI. Three jobs:
#   core-tests — the parity + completeness suite, on Linux (mirrors what the
#                Windows workstation runs locally with `dotnet test`).
#   ios-build  — the MAUI head against the iOS 26.5 SDK, on macos-latest.
#   ios27      — the MAUI head against the iOS 27.1 SDK on the xcode-27
#                image, then booted on an iOS 27 simulator with every screen
#                photographed (.github/scripts/ios-smoke.sh). The pictures
#                are uploaded as the "ios27-screens" artifact.
# Unsigned simulator builds only; signing and TestFlight need an Apple
# Developer membership and come later.
name: dotnet

on:
  push:
    paths:
      - "dotnet/**"
      - "shared/**"
      - "android/app/src/main/res/font/**"
      - ".github/workflows/ios.yml"
      - ".github/scripts/ios-smoke.sh"
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test AstraAntiqua.Core
        run: dotnet test dotnet/AstraAntiqua.Core.Tests --configuration Release
      - name: Compile-check the iOS head's pages (net8.0, no workload)
        run: dotnet build dotnet/AstraAntiqua.App.Check --configuration Release

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # .NET for iOS checks its Xcode by major.minor. The newest workload
      # (10.0.402.1, iOS SDK 27.1) needs Xcode 27.1, which macos-latest does
      # not carry yet (it tops out at 26.6). Workload set 10.0.401 ships iOS
      # SDK 26.5.10318, which itself requires Xcode 26.6, so the workload and
      # Xcode are pinned as a pair. Move both
      # together once the runner image gains a newer Xcode.
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - name: Install MAUI workload (pinned to the set that matches Xcode 26.6)
        run: dotnet workload install maui --version 10.0.401
      - name: Build iOS head (unsigned, simulator)
        run: >
          dotnet build dotnet/AstraAntiqua.App/AstraAntiqua.App.csproj
          -f net10.0-ios
          -c Release
          -p:RuntimeIdentifier=iossimulator-arm64

  ios27:
    # GitHub's Xcode 27 image (public preview): macOS 27, Xcode 27.0, 27.1
    # and 27.2 beta, iOS 27 simulators. Workload set 10.0.402.1 ships iOS SDK
    # 27.1.10018, which requires Xcode 27.1.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
      - name: Install MAUI workload (the set that ships the iOS 27.1 SDK)
        run: dotnet workload install maui --version 10.0.402.1
      - name: Build iOS head (unsigned, simulator, iOS 27.1 SDK)
        run: >
          dotnet build dotnet/AstraAntiqua.App/AstraAntiqua.App.csproj
          -f net10.0-ios
          -c Release
          -p:RuntimeIdentifier=iossimulator-arm64
      - name: Run every screen on an iOS 27 simulator
        run: |
          APP=$(find dotnet/AstraAntiqua.App/bin/Release/net10.0-ios/iossimulator-arm64 -maxdepth 1 -name "*.app" | head -1)
          bash .github/scripts/ios-smoke.sh "$APP" smoke
      - name: Upload the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios27-screens
          path: smoke/
          if-no-files-found: warn
