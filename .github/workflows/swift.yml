# The Swift surface's CI.
#   core-linux — AstraCore's parity suite (swift test) in the official Swift
#                container: the quick check that the Swift port composes what
#                web composes, against the same fixtures the C# core uses.
#   ios27-app  — the SwiftUI app on GitHub's Xcode 27 image: builds the
#                committed ios/AstraAntiqua.xcodeproj for the simulator with
#                Xcode 27.1, boots an iOS 27 iPhone simulator, photographs
#                every screen (.github/scripts/ios-smoke.sh), checks the glass
#                screens' placement against the canvas tables in
#                ios/placement/ (.github/scripts/check-placement.py), then
#                checks the committed project still matches ios/project.yml.
name: swift

on:
  push:
    paths:
      - "ios/**"
      - "shared/**"
      - "dotnet/AstraAntiqua.Core.Tests/TestData/**"
      - ".github/workflows/swift.yml"
      - ".github/scripts/ios-smoke.sh"
      - ".github/scripts/check-placement.py"
      - "android/app/src/main/res/font/**"
  workflow_dispatch:

jobs:
  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test AstraCore
        working-directory: ios/AstraCore
        run: swift test --parallel 2>&1 | tail -200
        shell: bash

  ios27-app:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
      # Release, for both simulator architectures (Apple silicon and Intel):
      # the build a browser-hosted simulator service such as Appetize takes,
      # and the same binary the screen run below exercises.
      - name: Build for the simulator (Release, unsigned, arm64 and x86_64)
        working-directory: ios
        shell: bash
        run: >
          xcodebuild
          -project AstraAntiqua.xcodeproj
          -scheme AstraAntiqua
          -sdk iphonesimulator
          -destination "generic/platform=iOS Simulator"
          -derivedDataPath build
          -configuration Release
          ARCHS="arm64 x86_64"
          ONLY_ACTIVE_ARCH=NO
          CODE_SIGNING_ALLOWED=NO
          build 2>&1 | grep -E "error:|warning:|BUILD" | tail -120
      - name: Run every screen on an iOS 27 simulator
        shell: bash
        run: >
          bash .github/scripts/ios-smoke.sh
          ios/build/Build/Products/Release-iphonesimulator/AstraAntiqua.app smoke 27
          com.astra.antiqua.swift "Library/Application Support/birth.v1.json"
      - name: Package the simulator build
        shell: bash
        run: |
          cd ios/build/Build/Products/Release-iphonesimulator
          lipo -info AstraAntiqua.app/AstraAntiqua
          ditto -c -k --sequesterRsrc --keepParent AstraAntiqua.app "$GITHUB_WORKSPACE/Astra Antiqua simulator build.zip"
          ls -la "$GITHUB_WORKSPACE/Astra Antiqua simulator build.zip"
      - name: Upload the simulator build
        uses: actions/upload-artifact@v4
        with:
          name: swift-simulator-build
          path: Astra Antiqua simulator build.zip
          if-no-files-found: error
      - name: Upload the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-ios27-screens
          path: smoke/
          if-no-files-found: warn
      # The build above used the committed project, exactly as a borrowed Mac
      # opens it. Regenerate it from ios/project.yml and report any drift, so
      # a spec change that was not committed as a project shows up here.
      - name: Check the committed project matches ios/project.yml
        working-directory: ios
        continue-on-error: true
        run: |
          brew install xcodegen
          xcodegen generate
          git status --short -- AstraAntiqua.xcodeproj AstraAntiqua/Info.plist
          git diff --exit-code -- AstraAntiqua.xcodeproj AstraAntiqua/Info.plist
      - name: Upload the regenerated Xcode project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-xcodeproj
          path: |
            ios/AstraAntiqua.xcodeproj
            ios/AstraAntiqua/Info.plist
          if-no-files-found: warn
      # Last, so a placement miss fails the job without stopping the uploads
      # above. It prints its table of canvas against app in the step's log.
      - name: Check the glass placement against the canvas (to within a point)
        if: always()
        shell: bash
        run: python3 .github/scripts/check-placement.py smoke ios/placement/*.json
