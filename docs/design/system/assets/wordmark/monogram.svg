<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -10 224 152" width="224" height="152" role="img" aria-label="Astra Antiqua monogram">
<title>The monogram: two A's as a ruined temple front</title>
<!--
  The flat-cut apex is a pediment, the crossbar at y=74 is the architrave
  running across both letters, and the second A stands broken on a two-step
  stylobate. The second A's right stroke stops at 178,76 instead of reaching
  the baseline: that is the broken column, with its fallen fragment beside it.
  The architrave is the accent (#B59A55 as authored). When this is wired into
  the app it should take the accent custom property so it follows the active culture.
  Imported from assets/monogram.svg in the Claude Design project.
-->
<g fill="currentColor" stroke="none">
  <rect x="-2" y="108" width="204" height="10"/>
  <rect x="-12" y="118" width="224" height="11"/>
  <rect x="92" y="86" width="13" height="22"/>
  <path d="M180 92 L190 108 H172 Z"/>
</g>
<g fill="none" stroke="currentColor" stroke-width="14" stroke-linejoin="miter">
  <path d="M6 108 L44 6 H52 L90 108"/>
  <path d="M106 108 L144 6 H152 L178 76"/>
</g>
<path d="M22 74 H174" stroke="#B59A55" stroke-width="8" fill="none"/>
</svg>
