# Project-wide Gradle settings.
android.useAndroidX=true
# Jetifier is deprecated and should be disabled for modern projects
android.enableJetifier=false
kotlin.code.style=official

# Increase heap size for Gradle daemon to fix OutOfMemoryError during dexing
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# KSP (the Room compiler) registers its generated sources through the
# kotlin.sourceSets DSL, which AGP's built-in Kotlin support rejects. Nothing
# in our own build scripts uses that DSL, so this is masking a KSP/AGP
# interaction, not our code: removing it fails the build outright with
# "Using kotlin.sourceSets DSL to add Kotlin sources is not allowed".
# Revisit when KSP or AGP changes how generated sources are registered.
android.disallowKotlinSourceSets=false
