# Project-wide Gradle settings.
android.useAndroidX=true
# Jetifier is deprecated and should be disabled for modern projects
android.enableJetifier=false
kotlin.code.style=official

# Clean up deprecated AGP options
android.uniquePackageNames=false
android.dependency.useConstraints=false
android.r8.strictFullModeForKeepRules=false

# Fix for "Using kotlin.sourceSets DSL to add Kotlin sources is not allowed with built-in Kotlin"
android.disallowKotlinSourceSets=false

# Increase heap size for Gradle daemon to fix OutOfMemoryError during dexing
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
